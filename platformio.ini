; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM3
upload_port = COM3

; SISTEMA COMPLETO: WiFiManager + Sistema Hidropônico
; Fluxo contínuo: AP para configuração -> Cliente WiFi -> Sistema completo

; Configuração de partição para mais espaço de código
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs

lib_deps =
	; Comunicação HTTP e Web Server (versões compatíveis)
	AsyncTCP @ ^1.1.1
	ESP Async WebServer @ ^1.2.3

	; WebSockets para Admin Panel
	links2004/WebSockets @ ^2.4.0
	
	; JSON para comunicação (essencial para configuração)
	bblanchon/ArduinoJson @ ^6.21.5
	
	; Sensores
	adafruit/DHT sensor library @ ^1.4.4
	adafruit/Adafruit Unified Sensor @ ^1.1.9
	milesburton/DallasTemperature @ ^3.11.0
	paulstoffregen/OneWire @ ^2.3.7
	4-20ma/ModbusMaster @ ^2.0.1
	
	; Display LCD
	marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
	
	; Expansor I/O para relés (mesma biblioteca do Hydro-Controller-main)
	robtillaart/PCF8574 @ ^0.3.9
	
	; Cliente HTTP para Supabase
	HTTPClient
	WiFiClientSecure
	
	; Bibliotecas ESP32
	SPIFFS
	WiFi
	Preferences
	
	; Buffer circular para dados
	rlogiacco/CircularBuffer @ ^1.4.0

	; MQTT MVP telemetria
	knolleary/PubSubClient @ ^2.8

; Configurações de build com timeout otimizado
build_flags = 
	-D SUPABASE_URL=\"${secrets.supabase_url}\"
	-D SUPABASE_ANON_KEY=\"${secrets.supabase_anon_key}\"
	-D MASTER_MODE
	-D CORE_DEBUG_LEVEL=3
	-D ASYNCWEBSERVER_REGEX
	-D CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
	-D CONFIG_ASYNC_TCP_STACK_SIZE=16384
	-D CONFIG_ASYNC_TCP_PRIORITY=10
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D ENABLE_MQTT=${secrets.mqtt_enabled}
	-D MQTT_HOST=\"${secrets.mqtt_host}\"
	-D MQTT_PORT=${secrets.mqtt_port}
	-D MQTT_USER=\"${secrets.mqtt_user}\"
	-D MQTT_PASS=\"${secrets.mqtt_pass}\"
	-D MQTT_HYDRO_ONLY=${secrets.mqtt_hydro_only}
	-D MQTT_HEALTH_ONLY=${secrets.mqtt_health_only}
	-D HIDRO_DEV_RELAX_SENSORS=1
	-D USE_PH_MODBUS_SENSOR=1
	-D HIDRO_SIMULATE_WATER_LEVELS=1
	-D HIDRO_EC_REQUIRES_PH_MODBUS=1

; Incluir todos los archivos fuente, excepto ESPNowTask.cpp (legacy, no usado)
build_src_filter = 
	+<*>	
	-<ESPNowTask.cpp>

; Configurações de monitor
monitor_filters = 
	esp32_exception_decoder
